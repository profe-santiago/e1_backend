spring.application.name=mi-app

# ===============================
# PostgreSQL
# ===============================
# Local:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/MVPClinica
# Docker:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/MVPClinica
# Nube:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/DB
#
# Tambien se soportan DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:MVPClinica}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:TU_PASSWORD_AQUI}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway aplica las migraciones SQL automaticamente al iniciar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# none: Flyway controla el esquema. No usar create/update en produccion.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

# ===============================
# Auth (JWT RS256)
# ===============================
# Clave publica RSA (PEM en una sola linea; los headers son opcionales) con la que se
# validan los tokens. En local usar el contenido de dev-public.pem.
auth.public.key=${AUTH_PUBLIC_KEY:TU_CLAVE_PUBLICA_RSA}

# URL del AuthService de InToGlobe (solo se usa con auth.mode=intoglobe).
auth.service.url=${AUTH_SERVICE_URL:http://localhost:4001}

# Modo de autenticacion:
#   intoglobe -> el login se delega al AuthService de InToGlobe (produccion).
#   local     -> credenciales contra la tabla usuario y token RS256 firmado aqui (desarrollo).
auth.mode=${AUTH_MODE:intoglobe}

# Ruta al PEM de la clave privada RSA que firma los tokens. Solo aplica con auth.mode=local.
# Debe ser el par de auth.public.key. Docker: /keys/dev-private.pem (montado como volumen :ro).
# NUNCA versionar la clave privada (*.pem esta en .gitignore).
auth.local.private-key-path=${AUTH_LOCAL_PRIVATE_KEY_PATH:}

# ===============================
# Datos seed (solo desarrollo)
# ===============================
# true carga una clinica de ejemplo con usuarios, medicos, pacientes, citas y pagos al arrancar.
# Mantener en false en cualquier ambiente compartido o productivo.
app.seed.enabled=${APP_SEED_ENABLED:false}

# ===============================
# FastAPI - Microservicio IA
# ===============================
# Local: http://localhost:8001
# Docker: http://medinflow-ia:8001
fastapi.url=${FASTAPI_URL:http://localhost:8001}

# ===============================
# Supabase Storage
# ===============================
# Bucket publico "adjuntos"; almacena resultados de estudios de los pacientes.
# Obtener credenciales en Project Settings > API > Project API Keys.
supabase.url=${SUPABASE_URL:https://TU_PROYECTO.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY:TU_SERVICE_ROLE_KEY_AQUI}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:adjuntos}

# ===============================
# Upload de archivos
# ===============================
app.upload.allowed-extensions=pdf,jpg,jpeg,png,webp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Circuit Breaker - FastAPI IA
# ===============================
resilience4j.circuitbreaker.instances.fastapi-ia.sliding-window-size=5
resilience4j.circuitbreaker.instances.fastapi-ia.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fastapi-ia.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fastapi-ia.permitted-number-of-calls-in-half-open-state=2

# ===============================
# RabbitMQ
# ===============================
# Local: usa las credenciales por defecto de RabbitMQ (guest/guest).
# Docker: RABBITMQ_HOST=rabbitmq (nombre del servicio en docker-compose).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Arranque automatico de los listeners (@RabbitListener, p. ej. onboarding tenant.created).
# false permite levantar el backend sin un broker RabbitMQ disponible (desarrollo local).
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_ENABLED:true}

# Nombre de la cola donde InToGlobe publica el evento tenant.created.
# Cambiar si el nombre real de la cola difiere del default.
onboarding.tenant-created.queue=${TENANT_CREATED_QUEUE:clinicas-tenant-created}

# ===============================
# NotifService (InToGlobe)
# ===============================
# URL del microservicio de notificaciones. Local: http://localhost:4002
notif.service.url=${NOTIF_SERVICE_URL:http://localhost:4002}

# ===============================
# AuditService (InToGlobe)
# ===============================
# Dejar vacío para deshabilitar auditoría sin romper el arranque.
audit.service.url=${AUDIT_SERVICE_URL:}

# ===============================
# Circuit Breaker - NotifService
# ===============================
resilience4j.circuitbreaker.instances.notif-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.notif-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notif-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notif-service.permitted-number-of-calls-in-half-open-state=2

# ===============================
# Circuit Breaker - AuditService
# ===============================
resilience4j.circuitbreaker.instances.audit-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.audit-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.audit-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.audit-service.permitted-number-of-calls-in-half-open-state=2

# ===============================
# ReminderJob
# ===============================
# Cron para el job de recordatorios de cita (48h y 24h antes).
# Por defecto corre cada 15 min. Para deshabilitar: pasar un cron que nunca dispare.
reminder.job.cron=${REMINDER_JOB_CRON:0 */15 * * * *}

# ===============================
#              Cors
# ===============================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# -- WhatsApp: canal intercambiable ---------------------------------------------
# simulado  -> no sale a internet; los mensajes quedan en whatsapp_mensaje y se responde
#              desde el panel "WhatsApp" (canal de pruebas). Valor por defecto.
# twilio    -> sandbox / número de Twilio. El ReminderJob NO envía salvo TWILIO_JOB_ENABLED=true.
# meta      -> WhatsApp Cloud API (plantilla aprobada + webhook firmado).
# intoglobe -> NotifService de InToGlobe (NotifClient).
# enlace    -> WhatsApp oficial vía https://wa.me/52...: el botón abre WhatsApp con el mensaje y un
#              enlace de un solo uso ({APP_PUBLIC_URL}/c/{token}) para confirmar o cancelar sin login.
#              El ReminderJob no envía con este canal.
notif.provider=${NOTIF_PROVIDER:simulado}

# Canal "enlace": URL pública del FRONTEND (sin "/" final), p. ej. http://192.168.0.10:5173 (Wi-Fi)
# o https://xxxx.trycloudflare.com (túnel). Límite de peticiones por IP a /api/public/citas.
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
public.rate-limit.por-minuto=${PUBLIC_RATE_LIMIT_POR_MINUTO:20}
# CORS: además de cors.allowed-origins se permite automáticamente app.public-url (el proxy de Vite reenvía
# ese Origin desde el celular) y esta lista extra separada por comas. Nunca uses "*".
app.cors.extra-origins=${APP_CORS_EXTRA_ORIGINS:}

# Twilio: credenciales en https://console.twilio.com (Account Info). Nunca las subas al repo.
whatsapp.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
whatsapp.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
# Remitente del sandbox ("whatsapp:+<numero>")
whatsapp.twilio.from=${TWILIO_WHATSAPP_FROM:whatsapp:+17372508034}
# URL pública EXACTA registrada en Twilio ("When a message comes in"), p. ej.
# https://xxxx.trycloudflare.com/api/whatsapp/twilio . Se usa para validar X-Twilio-Signature;
# los status callbacks llegan a <webhook-url>/status.
whatsapp.twilio.webhook-url=${TWILIO_WEBHOOK_URL:}
# false: con twilio solo se envía con el botón manual (el sandbox tiene cupo y 1 destinatario)
whatsapp.twilio.job-enabled=${TWILIO_JOB_ENABLED:false}
whatsapp.twilio.api-base-url=${TWILIO_API_BASE_URL:https://api.twilio.com}

# Meta WhatsApp Cloud API (developers.facebook.com > tu app > WhatsApp > API Setup)
whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:}
whatsapp.meta.access-token=${WHATSAPP_META_ACCESS_TOKEN:}
# App secret (App settings > Basic): valida X-Hub-Signature-256 del webhook
whatsapp.meta.app-secret=${WHATSAPP_META_APP_SECRET:}
# Cadena libre que se escribe igual en la configuración del webhook de Meta
whatsapp.meta.verify-token=${WHATSAPP_META_VERIFY_TOKEN:}
whatsapp.meta.api-version=${WHATSAPP_META_API_VERSION:v21.0}
# Plantilla aprobada con 5 parámetros: paciente, médico, fecha, hora, consultorio
whatsapp.meta.template-recordatorio=${WHATSAPP_META_TEMPLATE_RECORDATORIO:recordatorio_cita}
whatsapp.meta.template-lang=${WHATSAPP_META_TEMPLATE_LANG:es_MX}
whatsapp.meta.api-base-url=${WHATSAPP_META_API_BASE_URL:https://graph.facebook.com}

# Circuit Breaker - proveedores de WhatsApp
resilience4j.circuitbreaker.instances.whatsapp-twilio.sliding-window-size=5
resilience4j.circuitbreaker.instances.whatsapp-twilio.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.whatsapp-twilio.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.whatsapp-twilio.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.whatsapp-meta.sliding-window-size=5
resilience4j.circuitbreaker.instances.whatsapp-meta.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.whatsapp-meta.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.whatsapp-meta.permitted-number-of-calls-in-half-open-state=2
