spring.application.name=mi-app

# ===============================
# PostgreSQL
# ===============================
# Local:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/MVPClinica
# Docker:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/MVPClinica
# Nube:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://HOST:5432/DB
#
# Tambien se soportan DB_HOST, DB_PORT, DB_NAME, DB_USER y DB_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:MVPClinica}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:TU_PASSWORD_AQUI}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway aplica las migraciones SQL automaticamente al iniciar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# none: Flyway controla el esquema. No usar create/update en produccion.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

# ===============================
# JWT
# ===============================
# Clave secreta JWT. Recomendado: openssl rand -base64 32
jwt.secret=${JWT_SECRET:CLAVE_SECRETA_MINIMO_256_BITS}

# Tiempo de expiracion del token en milisegundos. 86400000 = 24 horas.
jwt.expiration=86400000

# ===============================
# FastAPI - Microservicio IA
# ===============================
# Local: http://localhost:8001
# Docker: http://medinflow-ia:8001
fastapi.url=${FASTAPI_URL:http://localhost:8001}

# ===============================
# Supabase Storage
# ===============================
# Bucket publico "adjuntos"; almacena resultados de estudios de los pacientes.
# Obtener credenciales en Project Settings > API > Project API Keys.
supabase.url=${SUPABASE_URL:https://TU_PROYECTO.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY:TU_SERVICE_ROLE_KEY_AQUI}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:adjuntos}

# ===============================
# Upload de archivos
# ===============================
app.upload.allowed-extensions=pdf,jpg,jpeg,png,webp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Circuit Breaker - FastAPI IA
# ===============================
resilience4j.circuitbreaker.instances.fastapi-ia.sliding-window-size=5
resilience4j.circuitbreaker.instances.fastapi-ia.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fastapi-ia.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fastapi-ia.permitted-number-of-calls-in-half-open-state=2

# ===============================
# RabbitMQ
# ===============================
# Local: usa las credenciales por defecto de RabbitMQ (guest/guest).
# Docker: RABBITMQ_HOST=rabbitmq (nombre del servicio en docker-compose).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Nombre de la cola donde InToGlobe publica el evento tenant.created.
# Cambiar si el nombre real de la cola difiere del default.
onboarding.tenant-created.queue=${TENANT_CREATED_QUEUE:clinicas-tenant-created}

# ===============================
# NotifService (InToGlobe)
# ===============================
# URL del microservicio de notificaciones. Local: http://localhost:4002
notif.service.url=${NOTIF_SERVICE_URL:http://localhost:4002}

# ===============================
# AuditService (InToGlobe)
# ===============================
# Dejar vacío para deshabilitar auditoría sin romper el arranque.
audit.service.url=${AUDIT_SERVICE_URL:}

# ===============================
# Circuit Breaker - NotifService
# ===============================
resilience4j.circuitbreaker.instances.notif-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.notif-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notif-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notif-service.permitted-number-of-calls-in-half-open-state=2

# ===============================
# Circuit Breaker - AuditService
# ===============================
resilience4j.circuitbreaker.instances.audit-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.audit-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.audit-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.audit-service.permitted-number-of-calls-in-half-open-state=2

# ===============================
# ReminderJob
# ===============================
# Cron para el job de recordatorios de cita (48h y 24h antes).
# Por defecto corre cada 15 min. Para deshabilitar: pasar un cron que nunca dispare.
reminder.job.cron=${REMINDER_JOB_CRON:0 */15 * * * *}

# ===============================
#              Cors
# ===============================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
