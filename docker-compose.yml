# Orquesta los 3 servicios.
# El orden de arranque es automático: postgres → mi-app (espera healthcheck) → medinflow-ia.

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-MVPClinica}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - clinica-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-MVPClinica}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mi-app:
    build:
      context: ./mi-app
      dockerfile: Dockerfile
    container_name: clinica-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-MVPClinica}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FASTAPI_URL: http://medinflow-ia:8001
      SUPABASE_URL: ${SUPABASE_URL:-https://cgfkxsfyucybzytqfyoi.supabase.co}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnZmt4c2Z5dWN5Ynp5dHFmeW9pIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3OTg0MzgwNywiZXhwIjoyMDk1NDE5ODA3fQ.55inNZkEtb5P9v0ZbUNg0U1iKfHJjFjRGDh4LO1uM3I}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-adjuntos}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinica-network

  medinflow-ia:
    build:
      context: ./medinflow-ia
      dockerfile: Dockerfile
    container_name: clinica-ia
    ports:
      - "8001:8001"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SPRING_BOOT_URL: http://mi-app:8080
      JWT_SECRET: ${JWT_SECRET}
      TZ: America/Mexico_City
    depends_on:
      - mi-app
    networks:
      - clinica-network

networks:
  clinica-network:
    driver: bridge

volumes:
  postgres_data:
